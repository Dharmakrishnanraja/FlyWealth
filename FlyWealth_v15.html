// CALCULATOR ENGINE

const BVS = [2500, 5000, 7500, 10000, 20000];
const LEVEL_NAMES = ['Basic', 'Advance', 'Pro', 'Royal', 'Crown'];

const PACKAGES = [
  { name:'Basic',   bv:2500,  fp:5,  cap:2500,   maxPairs:1,  crown:false },
  { name:'Advance', bv:5000,  fp:8,  cap:5000,   maxPairs:2,  crown:false },
  { name:'Pro',     bv:7500,  fp:10, cap:10000,  maxPairs:4,  crown:false },
  { name:'Royal',   bv:10000, fp:13, cap:50000,  maxPairs:20, crown:false },
  { name:'Crown',   bv:20000, fp:15, cap:100000, maxPairs:40, crown:true  },
];

const REPURCHASE_LEVELS = [
  { level:'Level 1', rate:8, amount:200, width:100 },
  { level:'Level 2', rate:6, amount:150, width:75  },
  { level:'Level 3', rate:5, amount:125, width:63  },

  { level:'Level 6', rate:2, amount:50,  width:25  },

const INCOME_STREAMS = [
  { id:1, name:'DSI — Direct Sales Income',     rate:'10% of BV',        type:'cash',    cap:'none'      },
  { id:2, name:'FlyPass Voucher Bonus',          rate:'5–15% of BV',      type:'voucher', cap:'none'      },

  { id:8, name:'Travel & Reward Bonus',          rate:'Rank based',       type:'travel',  cap:'rank'      },
  { id:9, name:'Rank Achievement Bonus',         rate:'Milestone based',  type:'cash',    cap:'none'      },
];

const RANKS = [
  { rank:1,  emoji:'⭐',   name:'Star Distributor',  teamA:'2,500',     teamB:'2,500'    },
  { rank:2,  emoji:'⭐⭐', name:'Silver Star',        teamA:'10,000',    teamB:'5,000'    },
  { rank:3,  emoji:'🌟',   name:'Gold Star',          teamA:'30,000',    teamB:'15,000'   },
  { rank:4,  emoji:'💎',   name:'Diamond',            teamA:'1,00,000',  teamB:'50,000'   },
  { rank:5,  emoji:'💎💎', name:'Double Diamond',     teamA:'2,50,000',  teamB:'1,25,000' },
  { rank:6,  emoji:'👑',   name:'Crown Diamond',      teamA:'5,00,000',  teamB:'2,50,000' },
  { rank:7,  emoji:'🏆',   name:'Royal Crown',        teamA:'10,00,000', teamB:'5,00,000' },
];

const PRODUCTS = [
  { name:'FlyONE (300g · 11 sachets)',     mrp:3500, dist:2625, profit:875 },
  { name:'NucleoVita+ (60 capsules)',      mrp:2999, dist:2625, profit:374 },
];

const fmt  = n => '₹' + Math.round(n||0).toLocaleString('en-IN');
const fmtS = n => {
  const v = Math.round(n||0);
  if (v >= 10000000) return '₹' + (v/10000000).toFixed(1).replace(/\.0$/,'') + 'Cr';
  if (v >= 100000)   return '₹' + (v/100000).toFixed(1).replace(/\.0$/,'')   + 'L';
  if (v >= 1000)     return '₹' + (v/1000).toFixed(1).replace(/\.0$/,'')     + 'K';
  return '₹' + v.toLocaleString('en-IN');
};

function calcResult(pkgIndex, counts, lPairs, capOn, boxes, dlCount) {
  const pkg = PACKAGES[pkgIndex];
  const totalDSI      = BVS.reduce((s,bv,i) => s + bv*0.10*(counts[i]||0), 0);
  const totalFP       = BVS.reduce((s,bv,i) => s + bv*(pkg.fp/100)*(counts[i]||0), 0);
  const totalDSICount = counts.reduce((s,c) => s + (c||0), 0);
  const chDetails = BVS.map((bv,i) => {
    const p = lPairs[i]||0;
    const ch = bv*0.08*p, dch = bv*0.08*p;
    return { ch, dch, net: ch+dch };
  });
  const totalPairs = lPairs.reduce((s,p) => s + (p||0), 0);
  const rawCh = chDetails.reduce((s,d) => s + d.net, 0);
  let chNet = rawCh;
  const capWarnings = [];
  if (capOn && rawCh > pkg.cap) {
    chNet = pkg.cap;
    BVS.forEach((_,i) => { if ((lPairs[i]||0) > pkg.maxPairs) capWarnings.push(LEVEL_NAMES[i]); });
  }
  const lBonus = pkgIndex===4 ? boxes*2500*0.15 : 0;
  const repTot = dlCount*2500*0.08;
  const repMo  = repTot/3;
  const totalCash = totalDSI + chNet + lBonus + repMo;
  const nettIncome = totalCash + totalFP;
  return { totalDSI, totalFP, totalDSICount, chDetails, chNet, totalPairs, capWarnings, lBonus, repTot, repMo, totalCash, nettIncome };
}

// MAIN APP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const DEFAULT_STATE = { pkgIndex:0, counts:[0,0,0,0,0], lPairs:[0,0,0,0,0], capOn:true, boxes:0, dlCount:0 };

function App() {
  const [tab, setTab] = useState(1);
  const [cs, setCS] = useState(()=>load(SK_CALC, DEFAULT_STATE));

  // Auto-save calculator state
  useEffect(()=>{ save(SK_CALC, cs); }, [cs]);

  // Pull-to-refresh prevention
  useEffect(()=>{
    let lY=0;
    const ts = e => { lY = e.touches[0].clientY; };
    const tm = e => {
      const y = e.touches[0].clientY;
      const atTop = window.scrollY===0 || document.documentElement.scrollTop===0;
      if (atTop && y > lY) e.preventDefault();
      lY = y;
    };
    document.addEventListener('touchstart', ts, { passive:true });
    document.addEventListener('touchmove', tm, { passive:false });
    return () => {
      document.removeEventListener('touchstart', ts);
      document.removeEventListener('touchmove', tm);
    };
  },[]);

  // Warn before leaving
  useEffect(()=>{
    const h = e => { e.preventDefault(); e.returnValue=''; return ''; };
    window.addEventListener('beforeunload', h);
    return ()=>window.removeEventListener('beforeunload', h);
  },[]);

  // Hide loading screen
  useEffect(()=>{
    setTimeout(()=>{
      const el = document.getElementById('loading');
      if(el) { el.style.opacity='0'; el.style.transition='opacity 0.5s'; setTimeout(()=>el.remove(),500); }
    }, 800);
  },[]);

  const res = calcResult(cs.pkgIndex, cs.counts, cs.lPairs, cs.capOn, cs.boxes, cs.dlCount);

  const screens = {
    0: <CompanyTab />,
    1: <LevelDSIScreen state={cs} setState={setCS} />,
    2: <ChannelScreen state={cs} setState={setCS} />,
    3: <BonusesScreen state={cs} setState={setCS} />,
    4: <InfoTab />,
    5: <ProductsTab />,
    6: <WhyFlyTab />,
    7: <AboutTab />,
  };

  return (
    <div style={{ minHeight:'100vh', background:'#f8fafc' }}>
      <TopBar result={res} />
      <div className="px-3 pt-3 pb-24">
        {screens[tab]}
      </div>
      <BottomNav current={tab} onChange={setTab} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
